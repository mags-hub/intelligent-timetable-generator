<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Timetable Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="narrow">
    <h1>Richfield Timetable Generator</h1>
    
    <p class="muted">Sign in to continue</p>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-wrap">
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="button" id="toggle-password" class="eye" aria-label="Show password" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </button>
</div>
      <p id="login-error" role="alert" hidden></p>
      <div class="actions"><button type="submit">Sign in</button></div>
    </form>
  </main>
  <script type="module">
    import { handleLoginForm } from "./js/auth.js";
  handleLoginForm(document.getElementById("login-form"));

  const password = document.getElementById("password");
  const eye = document.getElementById("toggle-password");
  eye.addEventListener("click", () => {
    const show = password.type === "password";
    password.type = show ? "text" : "password";
    eye.setAttribute("aria-pressed", String(show));
    eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });
  </script>
</body>
</html>
