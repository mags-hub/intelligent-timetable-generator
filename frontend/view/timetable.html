<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My timetable · Timetable Generator</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="bar"><div class="inner">
    <h1>My timetable</h1>
    <button id="logout" type="button">Sign out</button>
  </div></header>
  <main>
    <p id="subtitle" class="muted"></p>
    <div id="view-toggle" class="daytabs" role="group" aria-label="View">
      <button type="button" data-view="week" aria-pressed="true">Week</button>
      <button type="button" data-view="day" aria-pressed="false">Day</button>
    </div>
    <div id="timetable-area"></div>
    <p id="empty-state" class="msg info" hidden>No timetable has been published yet. Check back once your institution publishes it.</p>
  </main>
  <script type="module">
    import { requireRole, handleLogout } from "../js/auth.js";
    import { initTimetableView } from "../js/timetable.js";
    const user = await requireRole("lecturer", "student");
    handleLogout(document.getElementById("logout"));
    initTimetableView(user);
  </script>
</body>
</html>
